{% extends 'base.html' %}
{% load static %}
{% block head %}
    <link rel="stylesheet" href="{% static 'css/animal_list.css' %}"/>
    <script src="{% static "js/animalPaggination.js" %}"></script>
{% endblock %}
{% block content %}
    <style>
        .filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .filter-form .form-group {
            display: flex;
            flex-direction: column;
        }

        .filter-form button {
            align-self: center;
        }
    </style>
    <h1>Animal List</h1>

    <form method="get" class="filter-form">
        <div class="form-group">
            <label for="id_name">Name:</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label for="id_family">Family:</label>
            {{ form.family }}
        </div>
        <div class="form-group">
            <label for="id_countries">Countries:</label>
            {{ form.countries }}
        </div>
        <div class="form-group">
            <label for="id_place">Place:</label>
            {{ form.place }}
        </div>
        <div class="form-group">
            <label for="id_sort_by">Sort by:</label>
            {{ form.sort_by }}
        </div>
        <button type="submit">Filter</button>
    </form>

    <div class="anim" style="display: static">
        <div class="grid-container">
        </div>
    </div>

    <script>
        let list = []
        {% for animal in animals %}
            let tmp{{animal.id}} = {}
            tmp{{animal.id}}.url = "{{ animal.photo.url }}"
            tmp{{animal.id}}.name = "{{ animal.name }}"
            tmp{{animal.id}}.family = "{{ animal.view.family.name }}"
            tmp{{animal.id}}.countries = "{% for country in animal.counties.all %}{{ country.name }}{% if not forloop.last %}, {% endif %}{% endfor %}"
            tmp{{animal.id}}.facts = "{{ animal.facts }}"
            list.push(tmp{{animal.id}})
        {% endfor %}

        new AnimalPaggination(list, document.querySelector('.anim'))
    </script>

{% endblock %}
