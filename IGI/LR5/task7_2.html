<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Субстанции</title>
</head>
<body>

<form id="substanceForm">
    <label for="name">Название:</label>
    <input type="text" name="name" id="name"><br>
    <label for="weight">Удельный вес:</label>
    <input type="number" name="weight" id="weight" step="any"><br>
    <label for="conductivity">Проводимость:</label>
    <select name="conductivity" id="conductivity">
        <option value="проводник">Проводник</option>
        <option value="полупроводник">Полупроводник</option>
        <option value="диэлектрик">Диэлектрик</option>
    </select><br>
    <button class="btn" type="button">Добавить вещество</button>
</form>

<h3>Все вещества:</h3>
<div id="allSubstancesOutput"></div>

<button type="button" onclick="displaySemiconductors()">Показать полупроводники</button>

<h3>Полупроводники:</h3>
<div id="resultOutput"></div>

<script>



class Substance {
    constructor(name, weight) {
        this.name = name || '';
        this.weight = weight || 0;
    }

    get getName() {
        return this.name;
    }
    set setName(name) {
        this.name = name;
    }
    get getWeight() {
        return this.weight;
    }
    set setWeight(weight) {
        this.weight = weight;
    }

    addSubstanceFromForm(form) {
        this.setName = form.elements['name'].value;
        this.setWeight = parseFloat(form.elements['weight'].value);
    }

    static displayAllSubstances(array) {
        let output = '';
        for(let i=0; i<array.length; i++) {
            output += `Название: ${array[i].getName}, Удельный вес: ${array[i].getWeight}<br>`;
        }
        document.getElementById('allSubstancesOutput').innerHTML = output;
    }
}

class ConductiveSubstance extends Substance {
    constructor(name, weight, conductivity) {
        super(name, weight);
        this.conductivity = conductivity || '';
    }

    get getConductivity() {
        return this.conductivity;
    }
    set setConductivity(conductivity) {
        this.conductivity = conductivity;
    }

    addSubstanceFromForm(form) {
        super.addSubstanceFromForm(form);
        this.conductivity = form.elements['conductivity'].value;
    }

    static displayAllSubstances(array) {
        let output = '';
        for(let i=0; i<array.length; i++) {
            output += `Название: ${array[i].getName}, Удельный вес: ${array[i].getWeight}, Проводимость: ${array[i].getConductivity}<br>`;
        }
        document.getElementById('allSubstancesOutput').innerHTML = output;
    }

    static displayResult(array) {
        let output = '';
        for(let i=0; i<array.length; i++) {
            if(array[i].getConductivity === 'полупроводник') {
                output += `Название: ${array[i].getName}, Удельный вес: ${array[i].getWeight}<br>`;
            }
        }
        document.getElementById('resultOutput').innerHTML = output;
    }
}

let substances = [];

function addSubstance() {
    let form = document.getElementById('substanceForm');
    let newSubstance = new ConductiveSubstance();
    newSubstance.addSubstanceFromForm(form);
    substances.push(newSubstance);

    ConductiveSubstance.displayAllSubstances(substances);
}

function displaySemiconductors() {
    ConductiveSubstance.displayResult(substances);
}

document.getElementsByClassName('btn')[0].addEventListener('click', () => {
    addSubstance()
    }
)
</script>

</body>
</html>
