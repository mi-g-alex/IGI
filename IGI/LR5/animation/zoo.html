<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Scrolling with Images</title>
    <style>
        body, html {
            height: 200%;
            margin: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('back.jpg');
            background-size: cover;
            background-attachment: fixed; 
        }
        
        .animated-image {
            position: absolute;
            top: calc(50% - 30px); /* Ставим центрированно по оси Y */
            width: 400px;
            height: auto;
            transition: transform 0.1s ease-out;
        }
        
        .elephant {
            left: 0;
        }
        
        .giraffe {
            right: 0;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="e-cont">
    <img src="elephant.png" class="animated-image elephant" alt="Elephant">
    </div>
    <div class="g-cont">
        <img src="giraffe.png" class="animated-image giraffe" alt="Giraffe">
    </div>
    <script>
        document.addEventListener('scroll', () => {
            const scrollOffset = window.scrollY;
            const viewportWidth = window.innerWidth;
            const elephant = document.querySelector('.elephant');
            const giraffe = document.querySelector('.giraffe');
        
            // Движение слона вправо
            const elephantPosition = scrollOffset * 0.5; // Коэффициент скорости
            elephant.style.transform = `translate(${elephantPosition}px, ${scrollOffset}px)`;
        
            // Движение жирафа влево
            const giraffePosition = -scrollOffset * 0.5; // Коэффициент скорости
            giraffe.style.transform = `translate(${giraffePosition}px, ${scrollOffset}px)`;
        });
    </script>
</body>
</html>
